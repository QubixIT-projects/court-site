<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Court &mdash; Racket Sports Outfitters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
</head>
<body>

<div id="loading">
  <div class="display">THE COURT</div>
  <div class="bar"><span id="loading-bar"></span></div>
</div>

<div id="canvas-wrap"></div>
<div id="scrim"></div>

<div id="hud">
  <header>
    <div class="brand">
      <div class="name display">THE <span class="accent">COURT</span></div>
      <div class="tag mono">RACKET SPORTS OUTFITTERS</div>
    </div>
    <nav class="page-nav mono" id="page-nav">
      <button class="nav-close" id="nav-close" aria-label="Close menu">&times;</button>
      <a href="index.html" class="current">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-scrim" id="nav-scrim"></div>
    <button class="hamburger" id="hamburger-btn" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <button id="cart-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f3efe2" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="mono" id="cart-count">0</span>
    </button>
  </header>

  <div id="hint">Drag to <b>rotate</b> the shop &middot; scroll to <b>zoom</b> &middot; click any product to inspect it &middot; <a href="products.html" style="color:var(--lime);">browse full catalog &rarr;</a></div>

  <div class="section-nav" id="section-nav"></div>
</div>

<div id="product-panel">
  <button class="panel-close" id="panel-close">&times;</button>
  <div class="p-sport mono" id="p-sport"></div>
  <div class="p-name display" id="p-name"></div>
  <div class="p-desc" id="p-desc"></div>
  <div class="p-row">
    <div class="p-price mono" id="p-price"></div>
    <div class="p-stock mono" id="p-stock"></div>
  </div>
  <div class="qty-row">
    <button class="qty-btn" id="qty-minus">&minus;</button>
    <span id="qty-val" class="mono">1</span>
    <button class="qty-btn" id="qty-plus">+</button>
  </div>
  <button id="add-to-cart">ADD TO CART</button>
</div>

<div id="cart-drawer">
  <div class="cart-head">
    <h2>YOUR CART</h2>
    <button class="panel-close" id="cart-close">&times;</button>
  </div>
  <div id="cart-items"></div>
  <div class="cart-foot">
    <div class="cart-line"><span>Items</span><span id="cart-item-count" class="mono">0</span></div>
    <div class="cart-line total"><span>Total</span><span id="cart-total" class="mono">$0.00</span></div>
    <button id="checkout-btn">CHECK AVAILABILITY &amp; CHECKOUT</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/index.js"></script>
</body>
</html>
